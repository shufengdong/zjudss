[package]
name = "zjudss"
version = "0.1.0"
edition = "2024"
default-run = "zjudss"

[lib]
name = "zjudss"

[features]
default = []
e2e-test = []
release-test = ["e2e-test"]

[dependencies]
async-trait = "0.1"
argon2 = "0.6"
arrow-array = "60.1"
arrow-schema = "60.1"
axum = { version = "0.8", features = ["multipart"] }
chrono = "0.4"
cookie = "0.18"
calamine = "0.38"
csv = "1.4"
diesel = { version = "2.3", features = ["sqlite", "r2d2"] }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
diesel_migrations = "2.3"
dotenvy = "0.15"
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
parquet = { version = "60.1", features = ["arrow"] }
rig = { version = "0.46", features = ["test-utils"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "sync", "time", "test-util", "process", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
zip = { version = "9.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal"] }

[[bin]]
name = "e2e-server"
path = "src/bin/e2e-server.rs"
required-features = ["e2e-test"]