[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[features]
default = []
e2e-test = []
release-test = []

[dependencies]
async-trait = "0.1"
argon2 = "0.5"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = "0.4"
calamine = "0.37.0"
csv = "1.4.0"
diesel = { version = "2.3", features = ["sqlite", "r2d2"] }
diesel_migrations = "2.3"
dotenvy = "0.15"
futures = "0.3"
parquet = { version = "60.0.0", features = ["arrow"] }
reqwest = "0.13.5"
rand_core = { version = "0.6", features = ["getrandom"] }
rig = { version = "0.45.0", features = ["test-utils"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "net", "sync", "time", "process", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "e2e-server"
path = "src/bin/e2e-server.rs"
required-features = ["e2e-test"]
