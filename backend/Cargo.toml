[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = "0.4"
calamine = "0.37.0"
csv = "1.4.0"
diesel = { version = "2.3", features = ["sqlite", "r2d2"] }
diesel_migrations = "2.3"
dotenvy = "0.15"
futures = "0.3"
parquet = { version = "60.0.0", features = ["arrow"] }
reqwest = "0.13.5"
rig = { version = "0.45.0", features = ["test-utils"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "net", "sync", "time", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
