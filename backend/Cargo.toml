[package]
name = "zjudss"
version = "0.1.0"
edition = "2024"
default-run = "zjudss"

[lib]
name = "zjudss"

[features]
default = []
e2e-test = []
release-test = []

[dependencies]
async-trait = "0.1"
argon2 = "0.6.0"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = "0.4"
cookie = "0.18"
calamine = "0.37.0"
csv = "1.4.0"
diesel = { version = "2.3", features = ["sqlite", "r2d2"] }
diesel_migrations = "2.3"
dotenvy = "0.15"
futures = "0.3"
getrandom = "0.4.3"
hex = "0.4.3"
parquet = { version = "60.0.0", features = ["arrow"] }
rig = { version = "0.45.0", features = ["test-utils"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "process", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "e2e-server"
path = "src/bin/e2e-server.rs"
required-features = ["e2e-test"]
