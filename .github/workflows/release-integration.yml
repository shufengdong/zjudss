name: V4 candidate release gate

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  pr-gate:
    uses: ./.github/workflows/ci.yml

  release-gate:
    needs: pr-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: candidate-release
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TENSOREVAL_BIN: ${{ github.workspace }}/target/eig-rs/target/release/tensoreval
      SPARROWZZ_DIR: ${{ github.workspace }}/target/eig-rs/sparrowzz
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release users
        env:
          INIT_USERS_CSV: ${{ secrets.INIT_USERS_CSV }}
        run: |
          : "${INIT_USERS_CSV:?Set repository secret INIT_USERS_CSV}"
          umask 077
          printf '%s' "$INIT_USERS_CSV" > backend/resources/init_users.csv
      - name: Checkout current eig-rs
        uses: actions/checkout@v4
        with:
          repository: shufengdong/eig-rs
          path: target/eig-rs
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        run: |
          npm ci --prefix frontend
          npx --prefix frontend playwright install --with-deps chromium
      - name: Build current tensoreval
        run: cargo build --manifest-path target/eig-rs/Cargo.toml --release -p mems --bin tensoreval
      - name: Validate current engine layout
        run: |
          test -x "$TENSOREVAL_BIN"
          test -d "$SPARROWZZ_DIR/dss/docs"
          test -f "$SPARROWZZ_DIR/dss/docs/catalog/dataframes.json"
      - name: Run real DeepSeek and tensoreval journey
        run: ./scripts/test-release-integration
      - name: Require complete release functional coverage
        run: >-
          ./scripts/check-functional-coverage --require-release
          --report-json=target/functional-coverage/release.json
          --report-html=target/functional-coverage/release.html
      - name: Upload sanitized release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            target/functional-coverage/
            target/release-integration/engine-report.json
            target/release-integration/llm-report.json
            target/release-integration/release.log
            frontend/test-results/
