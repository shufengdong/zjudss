name: V3 PR gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      PLAYWRIGHT_JUNIT_OUTPUT_NAME: ../target/test-reports/playwright.xml
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test users
        run: install -m 600 integration-tests/fixtures/init_users.csv backend/resources/init_users.csv
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        run: |
          npm ci --prefix frontend
          npx --prefix frontend playwright install --with-deps chromium
          mkdir -p target/test-reports target/functional-coverage
      - name: Rust format and tests
        working-directory: backend
        run: |
          cargo fmt --all -- --check
          cargo test --features e2e-test
      - name: Frontend unit tests and build
        working-directory: frontend
        run: |
          npm test -- --run --reporter=default --reporter=junit --outputFile.junit=../target/test-reports/vitest.xml
          npm run build
      - name: Browser L1 and L2 journeys
        working-directory: frontend
        run: npm run test:e2e -- --reporter=line,junit
      - name: Require complete PR functional coverage
        run: >-
          ./scripts/check-functional-coverage --require-pr
          --report-json=target/functional-coverage/pr.json
          --report-html=target/functional-coverage/pr.html
      - name: Upload sanitized test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/test-reports/
            target/functional-coverage/
            frontend/test-results/
            frontend/playwright-report/
